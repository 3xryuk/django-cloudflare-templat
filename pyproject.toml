[project]
name = "django-cf-template"
version = "0.1.0"
description = "Django template for Cloudflare Workers using django-cf (D1, R2, Static Assets, Access)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-cf>=0.1.0",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "django-browser-reload>=1.13.0",
]
